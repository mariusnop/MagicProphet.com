name: "\U0001F41B Bug melden"
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Fehler so genau wie moeglich
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was haettest du erwartet?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Kartensuche
        - Karten-Scanner
        - Merklisten
        - Sammlung
        - Deck Builder
        - Markt/Preise
        - Profil/Einstellungen
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Falls vorhanden, Screenshots die den Fehler zeigen
    validations:
      required: false
