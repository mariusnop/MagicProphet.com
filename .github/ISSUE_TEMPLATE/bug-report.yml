name: "🐛 Report a bug"
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue as precisely as you can
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Card search
        - Card scanner
        - Watchlists
        - Collection
        - Deck builder
        - Market & prices
        - Profile & settings
        - Other
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: If possible, attach screenshots that show the issue
    validations:
      required: false
